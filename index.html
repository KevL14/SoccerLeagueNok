<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nokia Soccer League - Phaser 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #00ff00;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Estilo retro Nokia */
    canvas {
      border: 2px solid #00ff00;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>

  <!-- Contenedor del juego -->
  <div id="app"></div>

  <!-- Script principal - Vite inyectará el módulo aquí -->
  <script type="module" src="/src/main.js"></script>
